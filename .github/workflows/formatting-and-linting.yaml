name: Formatting and linting

on:
  pull_request:

env:
  APP_PATH: app
  APP_BACKEND_FOLDER: src-tauri
  APP_FE_FOLDER: src
  CORE_PATH: core
  CARGO_PROFILE_DEV_DEBUG: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # label the workflow runs that belong together
  cancel-in-progress: true # cancel any currently running jobs in the group if a new run is triggered

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable and components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ env.CORE_PATH }}
            ${{ env.APP_PATH }}/${{ env.APP_BACKEND_FOLDER }}

      - name: Core - Run formatter (rustfmt)
        run: cargo fmt --manifest-path ${{ env.CORE_PATH }}/Cargo.toml --all --check

      - name: App - Run formatter (rustfmt)
        run: cargo fmt --manifest-path ${{ env.APP_PATH }}/${{ env.APP_BACKEND_FOLDER }}/Cargo.toml --all --check

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libayatana-appindicator3-dev

      - name: Core - Run linter (clippy)
        run: cargo clippy --manifest-path ${{ env.CORE_PATH }}/Cargo.toml --all-targets --all-features -- -D warnings

      - name: App - Run linter (clippy)
        run: cargo clippy --manifest-path ${{ env.APP_PATH }}/${{ env.APP_BACKEND_FOLDER }}/Cargo.toml --all-targets --all-features -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"
          cache-dependency-path: ${{ env.APP_PATH }}/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run formatter (Prettier)
        run: yarn prettier --check ${{ env.APP_FE_FOLDER }}

      - name: Run linter (ESLint)
        run: yarn eslint ${{ env.APP_FE_FOLDER }}
